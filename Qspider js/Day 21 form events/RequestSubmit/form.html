<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form Validation with requestSubmit()</title>
  </head>
  <body>
    <form id="myform"  >
      <input type="text" id="name" placeholder="Enter Name" /><br /><br />
      <input type="email" id="mail" placeholder="Enter Email" /><br /><br />
      <input type="text" id="mob" placeholder="Enter Mobile" /><br /><br />
      <button type="submit">Submit</button>
    </form>

    <script>
      let form = document.getElementById("myform");
      let mail = document.getElementById("mail").value;
      let mob = document.getElementById("mob");

      
      // Normal submit handle
      
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      let mail = document.getElementById("mail").value;
      let mob = document.getElementById("mob").value;
      console.log("Form successfully submitted!");
      console.log(mail, mob)
    });
    
    mob.addEventListener("change",(e)=>{
      e.preventDefault();
   
      let mail = document.getElementById("mail").value;
      let mob = document.getElementById("mob");
      if (mail === "" || mob === "") {
        console.log("enter details");
      } else {
        console.log("req submit");
        console.log(mail,mob.value)
        form.requestSubmit();
        
      }
       })

        // Yahi pe hum auto-submit karwa rahe hai

    });
    */
    </script>
  </body>
</html>
