<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinator Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <article>
        <p class="p1">Direct child - 1</p>
        <p class="p2">Direct child - 2</p>
        <main>
            <p class="p3">Indirect child</p>
            <div class="p4">
            <aside>
                <nav>Nav child</nav>
            </aside>
            </div>
        </main>
        <span>Direct child - 4</span>
    </article>
    
</body>
</html>
