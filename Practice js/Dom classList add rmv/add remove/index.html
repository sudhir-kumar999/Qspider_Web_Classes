<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #btn{
            padding: 10px 20px;
            font-size: 16px;

            border-radius: 10px;
        }

    <div class="main">
    <button id="btn" onclick="stateChange()" class="off"> OFF</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
