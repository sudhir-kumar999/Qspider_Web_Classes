<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tag</title>
</head>
<body>
    <nav></nav>
    <header></header>
    <main></main>
    <section></section>
    <article></article>
    <aside></aside>
    <footer></footer>

    <!-- Semantic tags are HTML5 elements that clearly describe their meaning in a human- and machine-readable way.

📌 In simple words:

They tell the browser what type of content is inside a tag, not just how it looks.
    -->
</body>
</html>
