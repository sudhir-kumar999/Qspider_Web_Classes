<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 3</title>
</head>
<body>

    <table border="1" cellpadding="15px" rules="all">

            </tr>

            </tr>

                <th colspan="2">Schedule</th>
                <th rowspan="2">Topic</th>
            </tr>

            <tr align="center">
                
                <th>Start</th>
                <th>End</th>
            </tr>

        </thead>


        <tbody>
            <tr align="center">
                <td rowspan="2">Monday</td>

            <tr>
                <td>Uses</td>
            </tr>

            

                <tr align="center">
                    <td rowspan="4">Tuesday</td>

                    <td>11:00 PM</td>

                </tr>


                <tr align="center">
                    <td>11:00 AM</td>
                    <td>02:00 PM</td>
                    <td>Learn</td>
                    

                </tr>


                <tr align="center">
                    <td>02:00 PM</td>
                    <td>08:00 PM</td>

                </tr>

                <tr align="center">
                    <td>10:00 AM</td>
                    <td>01:00PM</td>
                    
                    
                </tr>

                <tr align="center">
                    <td>Wed-Fri</td>

                </tr>

                <tr align="center">
                    <td>Sat</td>
                    <td colspan="2">11:00 Am - 05:00 PM</td>

                </tr>
            
        </tbody>
    </table>
    
</body>
</html>
