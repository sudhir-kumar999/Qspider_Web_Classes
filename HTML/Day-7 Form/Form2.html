<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 2</title>
</head>
<body>
    <form action="#" method="">
        Name: <input type="text" name="user-name" required placeholder="Enter your name" autofocus minlength="2" maxlength="16" autocomplete=""><br><br>
        Email: <input type="email" name="user-email" required placeholder="Enter your Email" > <br><br>
        Password: <input type="password" name="user-password" required placeholder="Enter your Password"> <br><br>
        Mobile: <input type="tel" name="user-phone" placeholder="Enter your phone number" ><br><br>
        College: <input type="text" value="BEU University" disabled> <br><br>
        Principal: <input type="text" value="SK Singh" readonly><br><br>
        <button type="submit">Log in</button>
        <button type="reset">Cancel</button>

        
    </form>
    
</body>
</html>
