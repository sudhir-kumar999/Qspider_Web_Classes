<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Slide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu-icon">
        <button class="bar" id="bar"><i class="fa-solid fa-bars"></i></button>
        </div>
        
        <ul class="side-nav" id="items">
            <li>Home</li>
            <li>Section</li>
            <li>About</li>
            <li>Contact</li>
            <li>Refer</li>
        </ul>
    
    <script>
 
        const btn = document.getElementById('bar')
        const items = document.getElementById('items')
        btn.addEventListener('click',()=>{
            items.classList.toggle('active')
        })
    </script>


    <script src="https://kit.fontawesome.com/af4b4aea4b.js" crossorigin="anonymous"></script>
</body>
</html>
